name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build & test
        working-directory: scaffold
        run: mvn -B -ntp test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compliance scan
        run: python scripts/standards/scan-compliance.py --root scaffold
