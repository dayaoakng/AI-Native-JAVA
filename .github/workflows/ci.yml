name: CI

on:
  push:
    branches: [main, master, 'jdk*']
  pull_request:

jobs:
  build-and-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 按分支选择 JDK：jdk* 分支用 17，其余用 8
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ contains(github.ref_name, 'jdk') && '17' || '8' }}

      - name: Build & test
        working-directory: scaffold
        run: mvn -B -ntp test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compliance scan
        run: python scripts/standards/scan-compliance.py --root scaffold
