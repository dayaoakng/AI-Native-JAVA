spring:
  datasource:
    # H2 内存库，MySQL 兼容模式：开箱即启动，无需安装任何数据库
    url: jdbc:h2:mem:ddd_lite;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      # 每次启动都执行 schema.sql（内存库，重启即清空）
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

mybatis-plus:
  configuration:
    # 开发期打印 SQL，便于观察 MyBatis-Plus 自动拼接的查询
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
