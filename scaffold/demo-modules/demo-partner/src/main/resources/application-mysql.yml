# 连接本地/远程 MySQL（mysql profile）
# 用法：mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# 或：java -jar demo-partner.jar --spring.profiles.active=mysql
spring:
  datasource:
    # createDatabaseIfNotExist=true：库不存在时自动创建（本地开发便利项，生产环境请预先手工建库并移除该参数）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ddd_lite}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      # 与 H2 不同：这里用 CREATE TABLE IF NOT EXISTS，绝不 DROP，避免每次启动清空业务数据
      mode: always
      schema-locations: classpath:schema-mysql.sql
